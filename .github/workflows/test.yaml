name: PC-PARTS-COMPARISION-TEST

on:
  pull_request:
    branches:
      - main

  push: 
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci          

      - name: Run test
        run: npm run test